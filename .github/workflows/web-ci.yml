name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "specs/009-frontend-foundation-astryx/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "specs/009-frontend-foundation-astryx/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SERVICE_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Astryx component contract
        run: npm run astryx -- component Button --json > /tmp/astryx-button.json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: SSR smoke
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/esg-web.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /tmp/esg-home.html; then
              grep -q "Frontend Foundation" /tmp/esg-home.html
              exit 0
            fi
            sleep 1
          done
          cat /tmp/esg-web.log
          exit 1
