name: Service CI

on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - "specs/**"
      - ".github/workflows/service-ci.yml"
  pull_request:
    paths:
      - "service/**"
      - "specs/**"
      - ".github/workflows/service-ci.yml"

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: esg
          POSTGRES_USER: esg
          POSTGRES_PASSWORD: esg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esg -d esg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: service

    env:
      DATABASE_URL: postgresql+asyncpg://esg:esg@localhost:5432/esg
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: esg-report-ci
      MINIO_SECURE: "false"
      APP_ENV: test
      JWT_SECRET: ci-test-secret
      OPENVIKING_BASE_URL: http://127.0.0.1:1933

    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO
        working-directory: .
        run: |
          docker run -d --name esg-minio             -p 9000:9000             -e MINIO_ROOT_USER=minioadmin             -e MINIO_ROOT_PASSWORD=minioadmin             minio/minio:latest server /data
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs esg-minio
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check app tests migrations scripts --select E9,F63,F7,F82

      - name: Compile
        run: uv run python -m compileall -q app migrations scripts

      - name: Database migration
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest -q
