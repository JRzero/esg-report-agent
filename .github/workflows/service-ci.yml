name: Service CI

on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - "specs/**"
      - ".github/workflows/service-ci.yml"
  pull_request:
    paths:
      - "service/**"
      - "specs/**"
      - ".github/workflows/service-ci.yml"

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: esg
          POSTGRES_USER: esg
          POSTGRES_PASSWORD: esg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esg -d esg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: service

    env:
      DATABASE_URL: postgresql+asyncpg://esg:esg@localhost:5432/esg
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: local
      OPENVIKING_ENABLED: "false"
      APP_ENV: test
      JWT_SECRET: ci-test-secret-0123456789-abcdef

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Dependency consistency
        run: uv pip check

      - name: Ruff fatal checks
        run: uv run ruff check app tests migrations scripts --select E9,F63,F7,F82

      - name: Compile
        run: uv run python -m compileall -q app migrations scripts

      - name: Database migration from empty
        run: uv run alembic upgrade head

      - name: Migration round-trip from accepted v1
        run: |
          uv run alembic downgrade -2
          uv run alembic upgrade head

      - name: Tests
        run: uv run pytest -q

      - name: Performance smoke
        run: PERF_IN_PROCESS=true PERF_REQUESTS=100 PERF_CONCURRENCY=20 PERF_MAX_P95_MS=1000 uv run python scripts/perf_smoke.py

      - name: Build service container
        run: docker build -t esg-report-agent-service:test .

      - name: Verify non-root container
        run: docker run --rm esg-report-agent-service:test python -c "import os; assert os.getuid() != 0"
