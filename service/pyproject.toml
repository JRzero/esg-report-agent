[project]
name = "esg-report-agent-service"
version = "0.1.0"
description = "Evidence-grounded ESG report agent service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pyjwt>=2.9",
  "pwdlib[argon2]>=0.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "redis>=5.0",
  "celery>=5.4",
  "minio>=7.2",
  "structlog>=24.4",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
